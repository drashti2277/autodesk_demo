[project]
name = "autodesk-mcp-demo"
version = "1.0.0"
description = "Demo Autodesk MCP Server - Model Data Explorer, Revit Workflows, and Help Tools"
authors = [{name = "Your Name"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
]

[project.scripts]
autodesk-mcp-server = "autodesk_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
